<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="x-apple-disable-message-reformatting" />
<meta name="color-scheme" content="light only" />
<meta name="supported-color-schemes" content="light" />
<title>{{title}}</title>
<style type="text/css">
  :root { color-scheme: light only; supported-color-schemes: light; }
  html, body { background-color:#EEF0F5 !important; }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: light only !important; }
    html, body, .av-bg { background-color:#EEF0F5 !important; }
    .av-card, .av-box, .av-field { background-color:#FFFFFF !important; }
    .av-text { color:#0B0B14 !important; }
    .av-muted { color:#54566B !important; }
    .av-accent { color:#2743E8 !important; }
    .av-faint { color:#8A8CA0 !important; }
    .av-line { border-color:#E7E9F1 !important; }
    .av-wordmark { color:#2743E8 !important; }
  }
  [data-ogsc] .av-bg, [data-ogsc] .av-card, [data-ogsc] .av-box, [data-ogsc] .av-field,
  [data-ogsb] .av-bg, [data-ogsb] .av-card { background-color:#FFFFFF !important; }
</style>
</head>
<body class="av-bg" style="margin:0;padding:0;background-color:#EEF0F5;">
<span class="av-pre" style="display:none;font-size:1px;color:#EEF0F5;">{{preheader}}</span>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#EEF0F5" class="av-bg" style="background-color:#EEF0F5;">
  <tr><td align="center" class="av-wrap" style="padding:20px 12px;">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" bgcolor="#FFFFFF" class="av-card av-card-table" style="width:600px;max-width:600px;background-color:#FFFFFF;border:1px solid #E4E6EE;border-radius:20px;">

      <tr><td align="center" class="av-pad-head" style="padding:28px 28px 18px 28px;">
        <img src="https://pub-f5252f82c90c4ce38b12f50fbac1fea7.r2.dev/email-assets/av-logo.png" width="230" alt="AutoVault" class="av-logo" style="display:block;border:0;height:auto;" />
      </td></tr>

      <tr><td class="av-pad-divider" style="padding:0 28px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td class="av-line" style="border-top:1px solid #E7E9F1;font-size:0;line-height:0;">&nbsp;</td></tr></table></td></tr>

      {{body}}

      <tr><td align="center" class="av-pad-foot-top" style="padding:20px 28px 6px 28px;">
        <table role="presentation" cellpadding="0" cellspacing="0" width="100%"><tr>
          <td class="av-line" style="border-top:1px solid #E7E9F1;font-size:0;line-height:0;">&nbsp;</td>
          <td width="120" align="center" style="padding:0 10px;"><img src="https://pub-f5252f82c90c4ce38b12f50fbac1fea7.r2.dev/email-assets/av-mark.png" width="72" height="72" alt="AutoVault" style="display:block;border:0;" /></td>
          <td class="av-line" style="border-top:1px solid #E7E9F1;font-size:0;line-height:0;">&nbsp;</td>
        </tr></table>
      </td></tr>
      <tr><td align="center" class="av-pad-foot" style="padding:10px 0 12px 0;">
        <span class="av-wordmark" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;letter-spacing:5px;color:#2743E8;">AUTOVAULT</span>
      </td></tr>
      <tr><td align="center" class="av-pad-foot" style="padding:0 0 14px 0;">
        <table role="presentation" cellpadding="0" cellspacing="0" class="av-social"><tr>
          <td style="padding:0 10px;"><a href="https://www.instagram.com/autovault360" target="_blank"><img src="https://pub-f5252f82c90c4ce38b12f50fbac1fea7.r2.dev/email-assets/av-social-instagram.png" width="26" height="26" alt="Instagram" style="display:block;border:0;" /></a></td>
          <td style="padding:0 10px;"><a href="https://x.com/autovault360" target="_blank"><img src="https://pub-f5252f82c90c4ce38b12f50fbac1fea7.r2.dev/email-assets/av-social-x.png" width="24" height="24" alt="X" style="display:block;border:0;" /></a></td>
          <td style="padding:0 10px;"><a href="https://www.linkedin.com/company/autovault360" target="_blank"><img src="https://pub-f5252f82c90c4ce38b12f50fbac1fea7.r2.dev/email-assets/av-social-linkedin.png" width="26" height="26" alt="LinkedIn" style="display:block;border:0;" /></a></td>
        </tr></table>
      </td></tr>
      <tr><td align="center" class="av-pad-foot-note" style="padding:0 28px 24px 28px;">
        <p class="av-faint" style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;color:#8A8CA0;">{{footerNote}}</p>
      </td></tr>

    </table>
  </td></tr>
</table>
</body></html>
