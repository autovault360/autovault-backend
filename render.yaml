# Render Blueprint for AutoVault API
# Set secrets in the Render dashboard (do not commit real values).

services:
  - type: web
    name: autovault-backend
    runtime: node
    rootDir: Static/server
    # generate runs via postinstall; migrate must run before the app serves traffic
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    # If the dashboard overrides these, keep them identical:
    # Build: npm install && npx prisma generate
    # Start: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OWNER_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_WHOLESALER_PRICE_ID
        sync: false
      - key: STRIPE_INDEPENDENT_DEALER_PRICE_ID
        sync: false
      - key: STRIPE_GROWING_DEALERSHIP_PRICE_ID
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: AutoVault
      - key: SUPER_OWNER_EMAIL
        sync: false
      - key: SUPER_OWNER_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
